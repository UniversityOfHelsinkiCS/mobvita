services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mobvita_local
    ports:
      - "8000:8000"
    environment:
      NODE_OPTIONS: "--openssl-legacy-provider"
      REVITA_URL: "https://revita-test.cs.helsinki.fi/api"
      ENVIRONMENT: "development"
      NODE_ENV: "development"
      CHOKIDAR_USEPOLLING: "true"
      VITE_HMR_HOST: "localhost"
      VITE_HMR_CLIENT_PORT: "8000"
      WRITING_CLINIC_URL: "${WRITING_CLINIC_URL:-http://svm-58.cs.helsinki.fi:1234}"
      FIN_TTS_URL: "http://host.docker.internal:6000"
      ENG_TTS_URL: "http://host.docker.internal:6001"
      YANDEX_KEY: "${YANDEX_KEY:-}"
      TZ: "Europe/Helsinki"
    volumes:
      - ./:/usr/src/app
      # IMPORTANT: use a named volume for node_modules so you don't use host node_modules
      - mobvita_node_modules:/usr/src/app/node_modules
    command: ["sh", "-lc", "npm ci --include=dev && npm rebuild sqlite3 --build-from-source && npm run start:dev"]

volumes:
  mobvita_node_modules: {}
